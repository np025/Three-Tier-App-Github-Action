
name: Build and Push Frontend Backend to ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Login to Azure using OIDC
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Login to Azure Container Registry
      - name: Login to ACR
        run: az acr login --name acrnikita

      # 4. Build Frontend Image
      - name: Build Frontend
        run: |
          docker build \
            -t acrnikita.azurecr.io/frontend:v1 \
            ./Frontend

      # 5. Push Frontend Image
      - name: Push Frontend
        run: |
          docker push acrnikita.azurecr.io/frontend:v1

      # 6. Build Backend Image
      - name: Build Backend
        run: |
          docker build \
            -t acrnikita.azurecr.io/backend:v1 \
            ./Backend

      # 7. Push Backend Image
      - name: Push Backend
        run: |
          docker push acrnikita.azurecr.io/backend:v1

      # 8. Verify images
      - name: Verify ACR Images
        run: |
          az acr repository list \
            --name acrnikita \
            --output table
