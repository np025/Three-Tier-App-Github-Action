name: CD - Deploy to AKS

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy to AKS
        required: true
        type: choice
        options:
          - frontend
          - backend
          - both

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_NAME }}.azurecr.io
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
  AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
  IMAGE_TAG: ${{ github.sha }}
  K8S_NAMESPACE: demo

jobs:
  deploy:
    name: Build and deploy ${{ inputs.target }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build and push frontend
        if: inputs.target == 'frontend' || inputs.target == 'both'
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}

      - name: Build and push backend
        if: inputs.target == 'backend' || inputs.target == 'both'
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/backend:${{ github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing

      - name: Create namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Deploy frontend
        if: inputs.target == 'frontend' || inputs.target == 'both'
        run: |
          kubectl apply -f k8s/frontend-deployment.yaml && \
          kubectl set image deployment/frontend \
            frontend=$ACR_LOGIN_SERVER/frontend:$IMAGE_TAG \
            -n "$K8S_NAMESPACE"

          kubectl apply -f k8s/frontend-service.yaml

          kubectl rollout status deployment/frontend \
            -n "$K8S_NAMESPACE" --timeout=180s

      - name: Deploy backend
        if: inputs.target == 'backend' || inputs.target == 'both'
        run: |
          kubectl apply -f k8s/backend-deployment.yaml && \
          kubectl set image deployment/backend \
            backend=$ACR_LOGIN_SERVER/backend:$IMAGE_TAG \
            -n "$K8S_NAMESPACE"

          kubectl apply -f k8s/backend-service.yaml

          kubectl rollout status deployment/backend \
            -n "$K8S_NAMESPACE" --timeout=180s

      - name: Verify deployment
        run: |
          kubectl get deployments,pods,services \
            -n "$K8S_NAMESPACE"
