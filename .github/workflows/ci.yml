# Test CI workflow
name: "Test CI Workflow"

on: 
 pull_request: 
  branches: [main]

jobs: 
 build:
   runs-on: ubuntu-latest
   
   steps:
     - name: code checkout
       uses: actions/checkout@v4

     - name: setup node.js
       uses: actions/setup-node@v7
       with:
         node-version: 20
         cache: npm
    cache-dependency-path: Frontend/package-lock.json
